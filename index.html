  window.__pre = {
    sun: fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&daily=sunrise,sunset&timezone=Asia%2FSeoul&forecast_days=1').then((r) => r.json()).catch(() => null),
    wx: fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=weather_code,cloud_cover,temperature_2m,precipitation,wind_speed_10m,wind_direction_10m').then((r) => r.json()).catch(() => null),
  };
</script>
<style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

}

<body>
  <canvas id="bg"></canvas>
  <div class="fade-bottom"></div>
  <div class="container">
    <div class="name">Jeongwan Jeon</div>
    <a class="email" href="mailto:jjw@jjw.kr">jjw@jjw.kr</a>
  </div>
  <!--
  <div class="bottom-box">
    <span class="clock" id="clock"></span>
    <span class="weather" id="weather">Seoul</span>
  </div>
  -->
  <script type="module">
    import * as THREE from 'three';
    import { Sky } from 'three/addons/objects/Sky.js';

    const canvas = document.getElementById('bg');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 1, 20000);
    camera.position.set(0, 18, 80);

    const sun = new THREE.Vector3();

    const sky = new Sky();
    sky.scale.setScalar(10000);
    scene.add(sky);
    const skyU = sky.material.uniforms;
    skyU['mieDirectionalG'].value = 0.85;

    const cloudMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uCloud: { value: 0 },
        uWind: { value: 0 },
        uColor: { value: new THREE.Color(0xffffff) },
        uOpacity: { value: 1 },
        uSunUvY: { value: 2 },
        uSunGlow: { value: 0 },
        uDusk: { value: 0 },
      },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime;
        uniform float uCloud;
        uniform float uWind;
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform float uSunUvY;
        uniform float uSunGlow;
        uniform float uDusk;
        varying vec2 vUv;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          f = f*f*(3.0-2.0*f);
          return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                     mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
        }
        float fbm(vec2 p){
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 11.7; a *= 0.5; }
          return v;
        }
        void main() {
          vec2 uv = vUv;
          float drift = uTime * (0.004 + uWind * 0.012);
          vec2 p = vec2(uv.x * 7.0 + drift, uv.y * 2.6);
          float f = fbm(p + fbm(p * 1.7 - drift * 0.6) * 0.9);
          float cover = mix(0.72, 0.22, uCloud) + uDusk * 0.1;
          float shape = smoothstep(cover, cover + 0.3, f);
          float fadeTop = smoothstep(1.0, 0.55, uv.y);
          float fadeBot = smoothstep(0.0, 0.30, uv.y);
          float a = shape * fadeTop * fadeBot * uOpacity;
          vec2 dw = (uv - vec2(0.5, uSunUvY)) * vec2(16000.0, 3000.0);
          float dist = length(dw);
          float hole = smoothstep(120.0, 700.0, dist);
          a *= mix(0.06, 1.0, hole);
          float glowAmt = (1.0 - smoothstep(0.0, 1000.0, dist)) * uSunGlow;
          vec3 col = mix(uColor, vec3(1.0, 0.72, 0.42), clamp(glowAmt, 0.0, 1.0) * 0.6);
          a = max(a, glowAmt * 0.45);
          float hk = mix(3.2, 5.5, step(0.42, uv.y));
          float band = exp(-pow((uv.y - 0.42) * hk, 2.0)) * min(uDusk * 1.6, 1.0);
          col = mix(col, vec3(1.0, 0.36, 0.18), clamp(band, 0.0, 1.0) * 0.6);
          a = max(a, band * 0.42);
          gl_FragColor = vec4(col, a);
        }`
    });
    const clouds = new THREE.Mesh(new THREE.PlaneGeometry(16000, 3000), cloudMat);
    clouds.position.set(0, 260, -3500);
    scene.add(clouds);

    const glowMat = new THREE.ShaderMaterial({
      uniforms: {
        uDusk: { value: 0 },
      },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uDusk;
        varying vec2 vUv;
        void main() {
          vec2 uv = vUv;
          float horiz = exp(-pow((uv.y - 0.42) * 3.2, 2.0));
          float sunward = exp(-pow((uv.x - 0.5) * 1.9, 2.0));
          float g = horiz * mix(0.4, 1.0, sunward);
          vec3 warm = mix(vec3(1.0, 0.22, 0.08), vec3(1.0, 0.6, 0.28), clamp((uv.y - 0.42) * 3.0 + 0.3, 0.0, 1.0));
          float a = g * uDusk * 0.62;
          gl_FragColor = vec4(warm, a);
        }`
    });
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(20000, 4200), glowMat);
    glow.position.set(0, 260, -3800);
    scene.add(glow);

    const starGeo = new THREE.BufferGeometry();
    const N = 2500;
    const sPos = new Float32Array(N * 3);
    const sSize = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(Math.random());
      const r = 8000;
      sPos[i*3] = r * Math.sin(ph) * Math.cos(th);
      sPos[i*3+1] = r * Math.cos(ph);
      sPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
      sSize[i] = 0.8 + Math.pow(Math.random(), 2.5) * 2.4;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    starGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
    const starMat = new THREE.ShaderMaterial({
      uniforms: { uOpacity: { value: 0 }, uTime: { value: 0 }, uPR: { value: 1 } },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        attribute float aSize;
        uniform float uTime;
        uniform float uPR;
        varying float vTw;
        void main() {
          vTw = 0.7 + 0.3 * sin(uTime * 1.5 + position.x * 0.01);
          gl_PointSize = aSize * uPR;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform float uOpacity;
        varying float vTw;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.1, d);
          gl_FragColor = vec4(1.0, 1.0, 1.0, a * uOpacity * vTw);
        }`
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
    starMat.uniforms.uPR.value = renderer.getPixelRatio();

    const RAIN_N = 2400;
    const rainGeo = new THREE.BufferGeometry();
    const rPos = new Float32Array(RAIN_N * 2 * 3);
    const rSeed = new Float32Array(RAIN_N * 2);
    const rEnd = new Float32Array(RAIN_N * 2);
    for (let i = 0; i < RAIN_N; i++) {
      const x = (Math.random() - 0.5) * 320;
      const y = Math.random() * 90;
      const z = -240 + Math.random() * 340;
      const seed = Math.random();
      for (let e = 0; e < 2; e++) {
        const v = i * 2 + e;
        rPos[v*3] = x; rPos[v*3+1] = y; rPos[v*3+2] = z;
        rSeed[v] = seed; rEnd[v] = e;
      }
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
    rainGeo.setAttribute('aSeed', new THREE.BufferAttribute(rSeed, 1));
    rainGeo.setAttribute('aEnd', new THREE.BufferAttribute(rEnd, 1));
    const rainMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 },
        uWind: { value: 0 },
        uSpeed: { value: 1 },
      },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        uniform float uTime;
        uniform float uWind;
        uniform float uSpeed;
        attribute float aSeed;
        attribute float aEnd;
        void main() {
          vec3 p = position;
          float speed = (42.0 + aSeed * 30.0) * uSpeed;
          float y = mod(position.y - uTime * speed, 90.0);
          p.y = y - aEnd * 2.4;
          p.x += (90.0 - y) * uWind - aEnd * 2.4 * uWind;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }`,
      fragmentShader: `
        uniform float uOpacity;
        void main() {
          gl_FragColor = vec4(0.72, 0.8, 0.9, uOpacity);
        }`
    });
    const rain = new THREE.LineSegments(rainGeo, rainMat);
    scene.add(rain);

    const SNOW_N = 1800;
    const snowGeo = new THREE.BufferGeometry();
    const snPos = new Float32Array(SNOW_N * 3);
    const snSeed = new Float32Array(SNOW_N);
    for (let i = 0; i < SNOW_N; i++) {
      snPos[i*3] = (Math.random() - 0.5) * 320;
      snPos[i*3+1] = Math.random() * 90;
      snPos[i*3+2] = -240 + Math.random() * 340;
      snSeed[i] = Math.random();
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snPos, 3));
    snowGeo.setAttribute('aSeed', new THREE.BufferAttribute(snSeed, 1));
    const snowMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 },
        uWind: { value: 0 },
      },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        uniform float uTime;
        uniform float uWind;
        attribute float aSeed;
        void main() {
          vec3 p = position;
          p.y = mod(position.y - uTime * (2.6 + aSeed * 3.0), 90.0);
          p.x += sin(uTime * (0.4 + aSeed * 0.6) + aSeed * 40.0) * 2.4
               + uTime * uWind * (6.0 + aSeed * 5.0);
          p.x = mod(p.x + 160.0, 320.0) - 160.0;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (2.2 + aSeed * 3.2) * (60.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform float uOpacity;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.05, d);
          gl_FragColor = vec4(0.95, 0.97, 1.0, a * uOpacity);
        }`
    });
    const snow = new THREE.Points(snowGeo, snowMat);
    scene.add(snow);

    const cloudDay = new THREE.Color(0xf2f4f7);
    const cloudDusk = new THREE.Color(0xffc79b);
    const cloudNight = new THREE.Color(0x0e1219);
    const cloudGray = new THREE.Color(0x8a93a0);
    const cloudStorm = new THREE.Color(0x39414b);

    const weather = { cloud: 0, rain: 0, snow: 0, storm: 0, rainStrength: 0, snowStrength: 0, wind: 0 };
    const weatherTarget = { cloud: 0, rain: 0, snow: 0, rainStrength: 0, snowStrength: 0, wind: 0 };

    function kstDate() {
      return new Date(Date.now() + (9 * 60 + new Date().getTimezoneOffset()) * 60000);
    }

    const sunTimes = { sunrise: 6, sunset: 19.5 };

    const toHour = (s) => {
      const [h, m] = s.slice(11, 16).split(':').map(Number);
      return h + m / 60;
    };

    const SUN_URL = 'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&daily=sunrise,sunset&timezone=Asia%2FSeoul&forecast_days=1';
    async function fetchSunTimes(pre) {
      try {
        const { daily } = pre ?? await (await fetch(SUN_URL)).json();
        sunTimes.sunrise = toHour(daily.sunrise[0]);
        sunTimes.sunset = toHour(daily.sunset[0]);
      } catch {}
    }
    fetchSunTimes(window.__pre.sun);
    setInterval(fetchSunTimes, 3600000);

    function skyState() {
      const d = kstDate();
      const h = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
      const { sunrise, sunset } = sunTimes;
      const f = (h - sunrise) / (sunset - sunrise);
      return {
        elevation: Math.sin(Math.PI * f) * 62,
        azimuth: 90 + f * 180,
      };
    }

    // const clockEl = document.getElementById('clock');
    // const weatherEl = document.getElementById('weather');
    // function tickClock() {
    //   const d = kstDate();
    //   const p = (n) => String(n).padStart(2, '0');
    //   clockEl.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} KST`;
    // }
    // tickClock();
    // setInterval(tickClock, 1000);

    // const WEATHER_LABELS = {
    //   0: 'Clear', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
    //   45: 'Fog', 48: 'Fog',
    //   51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 56: 'Drizzle', 57: 'Drizzle',
    //   61: 'Rain', 63: 'Rain', 65: 'Rain', 66: 'Rain', 67: 'Rain',
    //   71: 'Snow', 73: 'Snow', 75: 'Snow', 77: 'Snow',
    //   80: 'Rain showers', 81: 'Rain showers', 82: 'Rain showers',
    //   85: 'Snow showers', 86: 'Snow showers',
    //   95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm',
    // };

    const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current=weather_code,cloud_cover,temperature_2m,precipitation,wind_speed_10m,wind_direction_10m';
    let wxPrimed = false;
    function applyWeather(current) {
      const code = current.weather_code;
      const precip = current.precipitation ?? 0;
      const windSpeed = current.wind_speed_10m ?? 0;
      const windDir = current.wind_direction_10m ?? 0;
      const windX = Math.sin(THREE.MathUtils.degToRad(windDir + 180)) * THREE.MathUtils.clamp(windSpeed / 40, 0, 1);
      weatherTarget.cloud = Math.max(current.cloud_cover / 100, code === 3 ? 0.9 : code <= 1 ? 0.1 : 0);
      weatherTarget.rain = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95 ? 1 : 0;
      weatherTarget.snow = (code >= 71 && code <= 77) || code === 85 || code === 86 ? 1 : 0;
      weatherTarget.rainStrength = weatherTarget.rain ? THREE.MathUtils.clamp(0.5 + precip * 0.4, 0.5, 1.6) : 0;
      weatherTarget.snowStrength = weatherTarget.snow ? THREE.MathUtils.clamp(0.6 + precip * 0.8, 0.6, 1.6) : 0;
      weatherTarget.wind = windX;
      weather.storm = code >= 95 ? 1 : 0;
      if (code === 45 || code === 48) weatherTarget.cloud = Math.max(weatherTarget.cloud, 0.7);
      const label = WEATHER_LABELS[code] ?? '';
      weatherEl.textContent = `Seoul ${Math.round(current.temperature_2m)}°C ${label}`;
    }
    async function fetchWeather(pre) {
      try {
        const { current } = pre ?? await (await fetch(WX_URL)).json();
        applyWeather(current);
        try { localStorage.setItem('wx', JSON.stringify({ t: Date.now(), current })); } catch {}
        if (!wxPrimed) { Object.assign(weather, weatherTarget); wxPrimed = true; }
      } catch {
        weatherEl.textContent = 'Seoul';
      }
    }
    try {
      const cached = JSON.parse(localStorage.getItem('wx'));
      if (cached?.current && typeof cached.current.weather_code === 'number' && Date.now() - cached.t < 3600000) {
        applyWeather(cached.current);
        Object.assign(weather, weatherTarget);
        wxPrimed = true;
      }
    } catch {}
    fetchWeather(window.__pre.wx);
    setInterval(fetchWeather, 600000);

    let mx = 0, my = 0;
    addEventListener('pointermove', (e) => {
      mx = (e.clientX / innerWidth - 0.5) * 2;
      my = (e.clientY / innerHeight - 0.5) * 2;
    });

    function resize() {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    const clock = new THREE.Clock();
    const look = new THREE.Vector3();
    let flash = 0;
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();

      weather.cloud += (weatherTarget.cloud - weather.cloud) * 0.01;
      weather.rain += (weatherTarget.rain - weather.rain) * 0.02;
      weather.snow += (weatherTarget.snow - weather.snow) * 0.02;
      weather.rainStrength += (weatherTarget.rainStrength - weather.rainStrength) * 0.02;
      weather.snowStrength += (weatherTarget.snowStrength - weather.snowStrength) * 0.02;
      weather.wind += (weatherTarget.wind - weather.wind) * 0.01;

      const { elevation, azimuth } = skyState();
      const day = THREE.MathUtils.clamp(elevation / 25, 0, 1);
      const dusk = THREE.MathUtils.clamp(1 - Math.abs(elevation) / 12, 0, 1)
        * THREE.MathUtils.clamp((elevation + 4) / 4, 0, 1);
      const night = THREE.MathUtils.clamp(-elevation / 10, 0, 1);
      document.body.classList.toggle('bright-sky', Math.max(day, dusk * 0.7) > 0.5);
      const cloud = weather.cloud;

      const phi = THREE.MathUtils.degToRad(90 - elevation);
      const theta = THREE.MathUtils.degToRad(azimuth);
      sun.setFromSphericalCoords(1, phi, theta);
      skyU['sunPosition'].value.copy(sun);
      skyU['turbidity'].value = THREE.MathUtils.lerp(10, 3, day) + dusk * 6 + cloud * 7;
      skyU['rayleigh'].value = (THREE.MathUtils.lerp(3, 1.1, day) + dusk * 2.5) * (1 - cloud * 0.25);
      skyU['mieCoefficient'].value = THREE.MathUtils.lerp(0.02, 0.004, day) + dusk * 0.01 + cloud * 0.01;

      if (weather.storm && Math.random() < 0.007) flash = 1;

      cloudMat.uniforms.uTime.value = t;
      cloudMat.uniforms.uCloud.value = cloud;
      cloudMat.uniforms.uWind.value = Math.abs(weather.wind);
      const wet = Math.max(weather.rain * (0.55 + 0.3 * weather.rainStrength), weather.storm * 0.9);
      cloudMat.uniforms.uDusk.value = dusk;
      cloudMat.uniforms.uColor.value.copy(cloudNight)
        .lerp(cloudDay, Math.max(day, dusk * 0.9) * (1 - wet * 0.5))
        .lerp(cloudDusk, dusk * 0.55)
        .lerp(cloudGray, cloud * 0.5 * Math.min(1, day + dusk * 0.5) * (1 - dusk * 0.6))
        .lerp(cloudStorm, wet * Math.min(1, day * 1.2 + dusk * 0.5 + 0.15))
        .multiplyScalar(1 + flash * 3);
      cloudMat.uniforms.uOpacity.value = (0.25 + cloud * 0.75) * (1 - night * 0.55);
      const cl = Math.hypot(sun.x, sun.z) || 1;
      clouds.position.set((sun.x / cl) * 3500, 260, (sun.z / cl) * 3500);
      clouds.lookAt(camera.position.x, 260, camera.position.z);
      glowMat.uniforms.uDusk.value = dusk * (1 - cloud * 0.35);
      glow.position.set((sun.x / cl) * 3800, 260, (sun.z / cl) * 3800);
      glow.lookAt(camera.position.x, 260, camera.position.z);
      cloudMat.uniforms.uSunUvY.value = 0.5 + (Math.tan(THREE.MathUtils.degToRad(THREE.MathUtils.clamp(elevation, -3, 60))) * 3500 - 242) / 3000;
      cloudMat.uniforms.uSunGlow.value =
        THREE.MathUtils.clamp(1 - Math.max(elevation, 0) / 16, 0, 1)
        * THREE.MathUtils.clamp((elevation + 2) / 4, 0, 1)
        * (1 - cloud * 0.55);

      starMat.uniforms.uOpacity.value = night * 0.9 * (1 - cloud);
      starMat.uniforms.uTime.value = t;
      stars.rotation.y = t * 0.004;

      rainMat.uniforms.uTime.value = t;
      rainMat.uniforms.uOpacity.value = weather.rain * (0.25 + 0.3 * weather.rainStrength);
      rainMat.uniforms.uWind.value = weather.wind * 0.5;
      rainMat.uniforms.uSpeed.value = 0.8 + weather.rainStrength * 0.5;
      snowMat.uniforms.uTime.value = t;
      snowMat.uniforms.uOpacity.value = weather.snow * (0.4 + 0.45 * weather.snowStrength);
      snowMat.uniforms.uWind.value = weather.wind;

      renderer.toneMappingExposure =
        (0.18 + 0.4 * Math.max(day, dusk * 0.9) + dusk * 0.08) * (1 - cloud * 0.22) * (1 - wet * 0.28) + flash * 0.7;
      flash *= 0.88;

      look.set(sun.x * 300, 24, sun.z * 300);
      camera.position.x += (Math.sin(t * 0.05) * 20 + mx * 8 - camera.position.x) * 0.02;
      camera.position.y += (18 - my * 4 - camera.position.y) * 0.02;
      camera.lookAt(look);
      renderer.render(scene, camera);
    });
  </script>
</body>
